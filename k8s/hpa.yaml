apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: nextjs-demo-app-hpa
  namespace: nextjs-app

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nextjs-demo-app

  minReplicas: 3
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
