apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler

metadata:
  name: nextjs-demo-app-vpa
  namespace: nextjs-app

spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nextjs-demo-app

  updatePolicy:
    updateMode: "Off"

  resourcePolicy:
    containerPolicies:
      - containerName: nextjs-demo-app
        minAllowed:
          cpu: 50m
          memory: 64Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
