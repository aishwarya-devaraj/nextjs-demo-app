apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: payment-api
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting payment-api..."
              echo "Validating production configuration..."
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not configured"
                exit 1
              fi
              echo "Application started successfully"
              sleep 3600
